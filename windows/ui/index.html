<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 年度报告</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="bg"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <header id="titlebar" data-tauri-drag-region>
    <div id="segments" data-tauri-drag-region></div>
    <div class="caption">
      <button id="win-min" title="最小化" aria-label="最小化"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button>
      <button id="win-max" title="最大化" aria-label="最大化"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1"/></svg></button>
      <button id="win-close" title="关闭" aria-label="关闭"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
    </div>
  </header>

  <main id="stage"></main>

  <footer id="bottombar" hidden>
    <span class="brand" id="brand"></span>
    <span class="spacer"></span>
    <span class="counter" id="counter"></span>
    <button class="nav" id="prev" aria-label="上一页"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
    <button class="nav" id="next" aria-label="下一页"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
  </footer>

  <div id="toast" hidden></div>

  <script src="format.js"></script>
  <script src="card.js"></script>
  <script src="slides.js"></script>
  <script src="vendor/mp4-muxer.js"></script>
  <script src="video.js"></script>
  <script src="app.js"></script>
</body>
</html>
