[package]
name = "ai-wrapped"
version = "1.4.0"
description = "AI 年度报告：本机 AI agent 年度回顾"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
zstd = "0.14"
rayon = "1"
walkdir = "2"
memchr = "2"
chrono = "0.4"
dirs = "6"
tauri-plugin-dialog = "2"
base64 = "0.22"
regex = "1"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Quick optimized builds for local testing (`cargo build --profile fast`).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
